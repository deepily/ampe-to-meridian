# Baseline XGBoost Experiment
# Overrides defaults.yaml for a focused XGBoost-only run

pipeline:
  experiment_name: "baseline-xgb-only"

training:
  algorithms:
    - "xgboost"
  smote_strategies:
    - "none"
    - "smote"
    - "smotetomek"

vizier:
  enabled: true
  max_trial_count: 30
  algorithm: "xgboost"
